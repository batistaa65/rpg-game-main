<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian's Forge</title>
    <link rel="stylesheet" href="guardians-forge.css">
</head>
<body>
    <div class="main-container">
        <div class="outer-container">
            <div class="location-container">
                <button class="back-button" onclick="location.href='../../village.html'">Back</button>
                <h1>Location: Guardian's Forge</h1>
            </div>
            <div class="inner-container" style="text-align: center;">
                <h2>Welcome to the Guardian's Forge</h2>
                <p>Here you can find powerful weapons and armor forged by the best blacksmiths.</p>
            </div>
            <div class="container">
                <div class="content-container">
                    <div class="items-container">
                        <button class="item">Item 1</button>
                        <button class="item">Item 2</button>
                        <button class="item">Item 3</button>
                        <button class="item">Item 1</button>
                        <button class="item">Item 2</button>
                        <button class="item">Item 3</button>
                        <button class="item">Item 1</button>
                        <button class="item">Item 2</button>
                        <button class="item">Item 3</button>
                        <button class="item">Item 1</button>
                        <button class="item">Item 2</button>
                        <button class="item">Item 3</button>
                        <button class="item">Item 1</button>
                        <button class="item">Item 2</button>
                        <button class="item">Item 3</button>
                        <button class="item">Item 1</button>
                        <button class="item">Item 2</button>
                        <button class="item">Item 3</button>
                    </div>
                </div>
            </div>
            <div class="footer-container">
                <div class="level-menu-bar">
                    <div class="level-container">
                        <div class="level-text">Level 1</div>
                        <div class="level-bar">
                            <div class="level-progress" style="width: 0%;"></div>
                            <span class="xp-text">0 / 100 XP</span>
                        </div>
                    </div>
                    <div class="menu-bar-container">
                        <div class="menu-bar">
                            <button id="inventory">Inventory</button>
                            <button id="character">Character</button>
                            <button id="quests">Quests</button>
                            <button id="save">Save</button>
                            <button id="options" onclick="location.href='../../../options/options.html'">Options</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../../../js/levelingSystem.js"></script>
</body>
</html>
